name: CI

on:
  push:
  pull_request:

# Versions match the Dockerfiles and docker-compose.test.yml (README, Versions).
env:
  GO_VERSION: "1.21.13"
  NODE_VERSION: "20.18.0"

jobs:
  go:
    name: Go unit tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [protos, log-sender, log-receiver, log-analysis, fixtures/regression]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  ui:
    name: UI type-check, unit and browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: log-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: log-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run build-only
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: log-ui/playwright-report

  integration:
    name: Regression fixture against ClickHouse
    runs-on: ubuntu-latest
    needs: [go, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: fixtures/regression/go.sum
      - run: make images
      - run: make test-stack-up
      - run: make fixture-load
      - run: make fixture-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-report
          path: fixtures/regression/results/report.md
      - name: Test stack logs
        if: failure()
        run: docker compose -p troubleshooting-test -f docker-compose.test.yml logs --no-color --tail 200
      - name: Remove the test stack
        if: always()
        run: make test-stack-reset
