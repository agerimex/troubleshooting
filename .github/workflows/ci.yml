name: CI

on:
  push:
  pull_request:

# Versions match the Dockerfiles and docker-compose.test.yml (README, Versions).
env:
  GO_VERSION: "1.21.13"
  NODE_VERSION: "20.18.0"

jobs:
  go:
    name: Go unit tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [protos, log-sender, log-receiver, log-analysis, quality-check, fixtures/regression, examples/quality-gate]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  # An application imports log-sender from GitHub: the replace => ../protos in
  # log-sender/go.mod doesn't apply to it, so the protos version log-sender
  # requires is the one it builds against. This module replaces log-sender
  # only, as a dependent sees it; protos comes from the module proxy. (Change
  # protos and log-sender in separate PRs: protos first, then log-sender
  # requires the published version.)
  log-sender-outside:
    name: log-sender as an outside module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build an application that imports log-sender
        env:
          GOWORK: "off"
          GOFLAGS: -mod=mod
        run: |
          dir=$(mktemp -d)
          cd "$dir"
          cat > go.mod <<EOF
          module outside

          go 1.21.5

          require github.com/agerimex/troubleshooting/log-sender v0.0.0

          replace github.com/agerimex/troubleshooting/log-sender => $GITHUB_WORKSPACE/log-sender
          EOF
          cat > main.go <<'EOF'
          package main

          import (
          	"context"

          	sender "github.com/agerimex/troubleshooting/log-sender"
          )

          func main() {
          	ctx := context.Background()
          	_, _ = sender.NewTracer("outside", sender.WithAddress("127.0.0.1:1"))
          	if e, err := sender.NewLogExporter("outside", sender.WithAddress("127.0.0.1:1")); err == nil {
          		_ = e.Send(ctx, []sender.LogRecord{sender.NewLogRecord(ctx, "INFO", "built outside")})
          		_ = e.Close()
          	}
          	_ = sender.Shutdown(ctx)
          }
          EOF
          go build ./...
          grep troubleshooting/protos go.mod

  ui:
    name: UI type-check, unit and browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: log-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: log-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run build-only
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: log-ui/playwright-report

  integration:
    name: Regression fixture against ClickHouse
    runs-on: ubuntu-latest
    needs: [go, ui]
    permissions:
      contents: read
      pull-requests: write # the quality gate comments on pull requests
    env:
      # The test stack's API tags its own spans with this run, so the quality
      # gate below can check its requests during the fixture.
      TROUBLESHOOTING_RUN: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: fixtures/regression/go.sum
      - run: make images
      - run: make test-stack-up
      - run: make fixture-load
      - run: make fixture-check
      # This repository is the quality gate's first user: the API must not
      # add database queries per request (docs/quality-gate.md).
      - name: Quality gate of the API's own requests
        uses: ./quality-check
        with:
          url: http://127.0.0.1:28094
          ui: none # the test stack is removed after the job; report.html keeps the evidence
          rules: .github/quality.yaml
          rules-from: base # a pull request cannot loosen its own limits
          run: ${{ env.TROUBLESHOOTING_RUN }}
          since: 3h
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-report
          path: fixtures/regression/results/report.md
      - name: Test stack logs
        if: failure()
        run: docker compose -p troubleshooting-test -f docker-compose.test.yml logs --no-color --tail 200
      - name: Remove the test stack
        if: always()
        run: make test-stack-reset

  # How an application uses the quality gate in its own CI, run for real:
  # a private Troubleshooting in the job (quality-check/stack), the example
  # application's tests send their spans to it, then the gate checks them.
  # The planted regression must fail the gate (docs/quality-gate.md).
  quality-example:
    name: Quality gate in an application's CI (example)
    runs-on: ubuntu-latest
    needs: [go]
    env:
      RUN_ID: example-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Start Troubleshooting in this job
        id: troubleshooting
        uses: ./quality-check/stack
      - name: Tests of the example application
        working-directory: examples/quality-gate
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ steps.troubleshooting.outputs.otlp-endpoint }}
          OTEL_EXPORTER_OTLP_INSECURE: "true"
          OTEL_RESOURCE_ATTRIBUTES: troubleshooting.run=${{ env.RUN_ID }}
        run: go test -count=1 ./...
      - name: Quality gate
        uses: ./quality-check
        with:
          url: ${{ steps.troubleshooting.outputs.url }}
          ui: ${{ steps.troubleshooting.outputs.ui }}
          run: ${{ env.RUN_ID }}
          rules: examples/quality-gate/quality.yaml
          since: 30m
          comment: "false"
          record: "true" # the job's own Troubleshooting: checks recording, not a real history
          artifact: example-quality-report
      - name: Tests with the planted regression
        working-directory: examples/quality-gate
        env:
          EXAMPLE_REGRESSION: "1"
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ steps.troubleshooting.outputs.otlp-endpoint }}
          OTEL_EXPORTER_OTLP_INSECURE: "true"
          OTEL_RESOURCE_ATTRIBUTES: troubleshooting.run=${{ env.RUN_ID }}-regression
        run: go test -count=1 ./...
      - name: Quality gate of the regression
        id: regression
        uses: ./quality-check
        with:
          url: ${{ steps.troubleshooting.outputs.url }}
          ui: ${{ steps.troubleshooting.outputs.ui }}
          run: ${{ env.RUN_ID }}-regression
          baseline: ${{ env.RUN_ID }}
          rules: examples/quality-gate/quality.yaml
          since: 30m
          fail-on: never
          comment: "false"
          record: "true"
          artifact: example-regression-report
      - name: The regression must fail the gate
        env:
          GATE: ${{ steps.regression.outputs.gate }}
        run: |
          if [ "$GATE" != failed ]; then
            echo "::error title=Quality gate example::the planted regression gave '$GATE', not failed"
            exit 1
          fi
      - name: Both evaluations are the requirements' history
        env:
          API: ${{ steps.troubleshooting.outputs.url }}
        run: |
          cat=$(curl -sf "$API/api/v1/quality/requirements?project=example-orders")
          echo "$cat" | jq '.data.Catalogue.requirements[] | {id, status, history: [.history[].status]}'
          got=$(echo "$cat" | jq -r '[.data.Catalogue.requirements[] | .id + "=" + ([.history[].status] | join(","))] | join(" ")')
          want="REQ-ORDER-READ=violated,met REQ-NO-LEGACY=violated,met"
          if [ "$got" != "$want" ]; then
            echo "::error title=Quality gate example::requirement history '$got', want '$want'"
            exit 1
          fi
      - name: Troubleshooting logs
        if: failure()
        run: tail -n 100 "${{ steps.troubleshooting.outputs.logs }}"/*.log
