version: '3'

# Settings are read from the shell or a .env file next to this file:
#   CLICKHOUSE_USER / CLICKHOUSE_PASSWORD   ClickHouse credentials (default user, no password)
#   TROUBLESHOOTING_TOKEN                   shared token senders must present to the receiver (off when empty)
#   UI_AUTH=basic, UI_USER, UI_PASSWORD_HASH basic auth for the UI and API (see Caddyfile)
# ClickHouse and the raw API port are published on 127.0.0.1 only; the UI and
# the receiver (50055 for log-sender, 4317 for OTLP) are reachable from the network.

services:

 clickhouse-server:
    # Pinned: new releases have changed how the default user is set up.
    # Upgrade deliberately and re-test (see CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT).
    image: clickhouse/clickhouse-server:26.9.13.15
    container_name: logs-clickhouse-server
    ports:
      - "127.0.0.1:18123:8123"
      - "127.0.0.1:19000:9000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      # Without this, current images lock "default" with an empty password to
      # localhost, so the other containers can't connect.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    networks:
      - troubleshooting_network
    volumes:
      - ./clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml
      # Named, so the data survives "docker compose down" and container
      # recreation. Only "docker compose down -v" deletes it.
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: always

 log-analysis-compose:
    image: 'docker-log-analysis:1'
    ports:
      - "127.0.0.1:8094:8094"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      TROUBLESHOOTING_TOKEN: ${TROUBLESHOOTING_TOKEN:-}
    networks:
      - troubleshooting_network
    depends_on:
      clickhouse-server:
        condition: service_healthy
    restart: always

 log-receiver-compose:
    image: 'docker-log-receiver:1'
    ports:
      - "50055:50055"
      - "4317:4317"   # OTLP/gRPC
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      TROUBLESHOOTING_TOKEN: ${TROUBLESHOOTING_TOKEN:-}
    networks:
      - troubleshooting_network
    depends_on:
      clickhouse-server:
        condition: service_healthy
    restart: always

 log-ui-compose:
    image: 'docker-log-ui:1'
    ports:
      - "8095:8095"
    environment:
      UI_AUTH: ${UI_AUTH:-off}
      UI_USER: ${UI_USER:-}
      UI_PASSWORD_HASH: ${UI_PASSWORD_HASH:-}
    networks:
      - troubleshooting_network
    restart: always
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile

volumes:
  clickhouse-data:

networks:
  troubleshooting_network:
    external: true
