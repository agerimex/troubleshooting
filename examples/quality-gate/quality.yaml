# Quality rules of the example application, checked in CI
# (.github/workflows/ci.yml, job quality-example; docs/quality-gate.md).
version: 1
project: example-orders
run:
  executions: 41      # the tests make 41 requests: fewer recorded means lost executions
entry:
  service: example-orders
  operation: GET /orders/{id}
  span_kind: server
checks:
  - id: orders-p95
    type: latency
    max_ms: 250
    target_ms: 100
  - id: orders-db-calls
    type: db_calls
    max_per_execution: 3
    target_per_execution: 2
  - id: no-legacy-pricing
    type: forbidden_call
    to: legacy-pricing
requirements:
  - id: REQ-ORDER-READ
    title: Reading an order stays one query per table
    owner: orders-team
    why: An N+1 read of prices makes large orders slow and loads the database.
    checks: [orders-db-calls]
    guardrails: [orders-p95]   # supports it, decides the gate, not its status
  - id: REQ-NO-LEGACY
    title: Orders never call the legacy pricing service
    owner: orders-team
    why: legacy-pricing is being retired.
    checks: [no-legacy-pricing]
