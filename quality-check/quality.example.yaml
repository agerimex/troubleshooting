# Quality rules for troubleshooting-check (quality-gate-v1, docs/quality-gate.md).
version: 1

# Optional: what the test run declares. The tests run each checked entry this
# often; fewer recorded executions means lost ones (unresolved, not a pass).
run:
  executions: 200

# The operation an execution starts with; a check can set its own entry.
entry:
  service: recording-api
  operation: start_session
  span_kind: server

checks:
  # p95 of the entry span's duration over the run.
  - id: startup-p95
    type: latency
    percentile: 95
    max_ms: 800
    target_ms: 500

  # Recorded database calls (CLIENT spans with db.system) in every execution.
  - id: db-calls
    type: db_calls
    max_per_execution: 3
    target_per_execution: 2

  # No execution may call this service.
  - id: no-directory
    type: forbidden_call
    to: directory-api

# Optional: requirements say why the checks exist. Each names its owner and
# the checks that assess it; its status comes from those checks (met,
# violated, not enough data). Guardrails support a requirement without
# assessing it: they are listed with it and decide the gate like every check,
# but never its status (four database calls don't show that a start was
# slow). A requirement without checks is listed as not evaluated: written
# down, never met.
requirements:
  - id: REQ-START
    title: A recording session starts within 800 ms
    owner: recording-team
    why: Participants leave a session that takes more than a second to start.
    checks: [startup-p95]
    guardrails: [db-calls]
  - id: REQ-DIRECTORY
    title: Starting a session must not call the directory
    owner: recording-team
    why: The directory is slow and has no availability guarantee.
    checks: [no-directory]
  - id: REQ-OUTAGE
    title: Recording continues during an analytics outage
    owner: recording-team
    why: Analytics is optional; a recording is not.
