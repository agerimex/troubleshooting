syntax = "proto3";

package logs;
option go_package = "./logs";

import "google/protobuf/timestamp.proto";
// import "opentelemetry/proto/trace/v1/trace.proto";

service LogService {
    rpc LogMessage(LogMessageRequest) returns (LogMessageResponse);
    rpc SendSpans(Spans) returns (LogMessageResponse);
    // SendLogs stores a batch of log records. It answers only after the whole
    // batch is written; an error means none of it may be counted as stored,
    // and the sender retries the same records (same record_id).
    rpc SendLogs(Logs) returns (LogMessageResponse);
}

message LogMessageRequest {
    string message = 1;
    google.protobuf.Timestamp timestamp = 2;
    // Fields 3-8 are optional; senders that only set message and timestamp
    // keep working, and their records have no correlation.
    // record_id is the stable identity of one log event: a retry repeats it,
    // a separate event gets a new one. Empty: the receiver assigns one, so a
    // retry of that record is stored twice.
    string record_id = 3;
    // trace_id (32 hex) and span_id (16 hex) of the span active when the
    // record was written; empty when there was none.
    string trace_id = 4;
    string span_id = 5;
    // severity: TRACE, DEBUG, INFO, WARN, ERROR or FATAL; empty if unknown.
    string severity = 6;
    string service_name = 7;
    map<string, string> attributes = 8;
}

message Logs {
    repeated LogMessageRequest logs = 1;
}

message LogMessageResponse {
    bool success = 1;
}

message Attribute {
  string key = 1;
  string value = 2;
}

message OneSpan {
  google.protobuf.Timestamp Timestamp = 1;
  string TraceId = 2;
  string SpanId = 3;
  string ParentSpanId = 4;
  string TraceState = 5;
  string SpanName = 6;
  string SpanKind = 7;
  string ServiceName = 8;
  map<string, string> ResourceAttributes = 9;
  map<string, string> SpanAttributes = 10;
  int64 Duration = 11;
  int32 StatusCode = 12;
  string StatusMessage = 13;
  // Events_* and Links_* are parallel arrays: element i of each describes the
  // same event/link. Events_Attributes[i] / Links_Attributes[i] carry the whole
  // attribute map of that event/link: key = event name (empty for links),
  // value = the attributes as a JSON object of strings.
  repeated google.protobuf.Timestamp Events_Timestamp = 14;
  repeated string Events_Name = 15;
  repeated Attribute Events_Attributes = 16;
  repeated string Links_TraceId = 17;
  repeated string Links_SpanId = 18;
  repeated string Links_TraceState = 19;
  repeated Attribute Links_Attributes = 20;
  int32 ChildSpanCount = 21;
}

message Spans {
  repeated OneSpan spans = 1;
}
